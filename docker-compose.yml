services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: campus_mitra_postgres
    restart: always
    environment:
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_password
      POSTGRES_DB: campus_mitra
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Backend/postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_mitra"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campus-network

  # 2. Node.js Express Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-target
    container_name: campus_mitra_backend
    restart: always
    environment:
      PORT: "5000"
      DATABASE_URL: postgres://campus_user:campus_password@postgres:5432/campus_mitra
      DB_HOST: postgres
      DB_USER: campus_user
      DB_PASSWORD: campus_password
      DB_NAME: campus_mitra
      DB_PORT: "5432"
      PGPORT: "5432"
      PGHOST: postgres
      PGUSER: campus_user
      PGPASSWORD: campus_password
      PGDATABASE: campus_mitra
      JWT_SECRET: campus_mitra_jwt_secret_key
    expose:
      - "5000"
    ports:
      - "5050:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus-network

  # 3. React Frontend Service (Also proxies port 3000 API calls)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-target
    container_name: campus_mitra_frontend
    restart: always
    ports:
      - "8085:80"   # Frontend Web UI
      - "3000:80"   # Catches http://localhost:3000/api/... requests and handles CORS
    depends_on:
      - backend
    networks:
      - campus-network

networks:
  campus-network:
    driver: bridge

volumes:
  pgdata: