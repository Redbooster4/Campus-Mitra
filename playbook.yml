---
- name: Provision local environment for Campus-Mitra
  hosts: localhost
  connection: local
  become: true
  vars:
    node_version: "20.x"
    system_packages:
      - git
      - curl
      - build-essential
      - python3
      - python3-pip
      - python3-venv
      - postgresql
      - postgresql-contrib
      - nginx

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies and databases
      apt:
        name: "{{ system_packages }}"
        state: present

    - name: Add NodeSource official repository
      shell: "curl -fsSL https://deb.nodesource.com/setup_{{ node_version }} | bash -"
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js
      apt:
        name: nodejs
        state: present

    - name: Ensure PostgreSQL service is active
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Ensure Nginx service is active
      systemd:
        name: nginx
        state: started
        enabled: yes